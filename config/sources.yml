sources:
  - id: acled
    name: ACLED Ukraine Conflict Monitor
    url: https://acleddata.com/monitor/ukraine-conflict-monitor
    type: conflict_events
    access: api_or_download
    notes: Historical conflict events; requires appropriate ACLED access.

  - id: alerts_in_ua
    name: Alerts.in.ua API
    url: https://devs.alerts.in.ua/
    type: air_alerts
    access: api_key
    notes: Historical air-alert intervals by region/district/community.

  - id: ohchr
    name: UN Human Rights Monitoring Mission in Ukraine
    url: https://ukraine.ohchr.org/en/reports/protection-of-civilians
    type: civilian_casualties
    access: public_reports
    notes: Use for casualty verification and monthly aggregates.

  - id: kaggle_missile_attacks
    name: Massive Missile Attacks on Ukraine
    url: https://www.kaggle.com/datasets/piterfm/massive-missile-attacks-on-ukraine
    type: missile_uav_history
    access: public_dataset
    notes: Secondary dataset; retain original source fields and provenance.

  - id: viina
    name: VIINA Ukraine Violence Data
    url: https://github.com/scott4ai/ukraine-violence-data
    type: geocoded_aerial_incident_evidence
    access: public_github_dataset
    notes: Independent media-derived incident evidence; aerial/uav classes are kept separate from Kaggle raw counts.

  - id: etryvoga_history
    name: Ukrainian Air Raid Sirens Dataset
    url: https://github.com/Vadimkin/ukrainian-air-raid-sirens-dataset
    type: air_alert_history
    access: public_github_dataset
    notes: Alert intervals are context only and must not be counted as attack facts.
