name: weekly-learning-cycle

concurrency:
  group: weekly-learning-cycle-main
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/ml/**"
      - "src/data/**"
      - "src/dashboard/**"
      - "streamlit_app.py"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/learning-cycle.yml"
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore previous champion
        uses: actions/cache/restore@v4
        with:
          path: models
          key: ml-champion-${{ github.run_id }}
          restore-keys: |
            ml-champion-

      - name: Download current public source data
        run: python scripts/download_kaggle.py

      - name: Build normalized tables
        run: python scripts/build_processed_kaggle.py

      - name: Validate data quality
        run: python scripts/data_quality_report.py

      - name: Run controlled learning cycle
        run: python scripts/self_improve.py

      - name: Build dashboard snapshot
        run: python scripts/build_dashboard_data.py

      - name: Run test suite
        run: pytest

      - name: Save champion for next run
        if: success()
        uses: actions/cache/save@v4
        with:
          path: models
          key: ml-champion-${{ github.run_id }}

      - name: Publish dashboard snapshot
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/dashboard/*.csv data/dashboard/*.json
          if git diff --cached --quiet; then
            echo "Dashboard snapshot unchanged"
          else
            git commit -m "Update dashboard snapshot [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload learning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-cycle-${{ github.run_number }}
          path: |
            models/*.json
            models/*.joblib
            data/processed/unmapped_regions.csv
            data/processed/source_duplicates.csv
            data/processed/data_quality_report.json
            data/dashboard/*.csv
            data/dashboard/*.json
          if-no-files-found: warn
          retention-days: 30
